<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Safelight Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=DM+Serif+Display&family=Bebas+Neue&family=Caveat:wght@700&display=swap">
<style>
/* Layout: pro editor shell. Tool rail left, pasteboard center, color + layers + history stack right; on phones the tools drop to a bottom strip and panels become a sheet. */
:root{
  color-scheme:dark;
  --ink:#111215;
  --chrome:#191b20;
  --chrome-2:#23262d;
  --line:#2f333b;
  --text:#e8e4dc;
  --muted:#8d909a;
  --amber:#f2b552;
  --amber-ink:#1d1405;
  --amber-dim:rgba(242,181,82,.14);
  --amber-edge:rgba(242,181,82,.45);
  --danger:#e46a5c;
  --pasteboard:#0c0d10;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --checker:repeating-conic-gradient(#d9d9de 0 25%,#ffffff 0 50%) 0 0/8px 8px;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--ink);color:var(--text);font-family:var(--ui);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:grid;grid-template-columns:52px minmax(0,1fr) 300px;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"menu menu menu" "opts opts opts" "tools stage panels" "status status status"}

.menubar{grid-area:menu;display:flex;align-items:center;gap:2px;padding:0 12px;height:44px;background:var(--chrome);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:.02em;margin-right:12px;white-space:nowrap}
.lamp{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px 3px rgba(242,181,82,.5)}
#menus{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
#menus::-webkit-scrollbar{display:none}
.menu-btn{background:none;border:0;color:var(--text);font-weight:500;font-size:13px;padding:6px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{background:var(--chrome-2)}
.spacer{flex:1}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;background:none;border:0;color:var(--text);border-radius:7px;cursor:pointer;flex:none;font-weight:700}
.icon-btn:hover:not(:disabled){background:var(--chrome-2)}
.icon-btn:disabled{color:var(--muted);opacity:.45;cursor:default}
.panel-toggle{display:none;gap:6px;width:auto;padding:0 10px;font-weight:600;font-size:12px}
.menu-pop{position:fixed;z-index:50;min-width:236px;max-height:calc(100% - 60px);overflow-y:auto;background:var(--chrome-2);border:1px solid var(--line);border-radius:9px;padding:5px;box-shadow:0 14px 36px rgba(0,0,0,.55)}
.menu-pop button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:24px;padding:7px 10px;background:none;border:0;color:var(--text);font-size:13px;border-radius:5px;text-align:left;cursor:pointer}
.menu-pop button:hover:not(:disabled),.menu-pop button:focus-visible{background:var(--amber);color:var(--amber-ink);outline:none}
.menu-pop button:hover:not(:disabled) kbd{color:var(--amber-ink)}
.menu-pop button:disabled{color:var(--muted);opacity:.5;cursor:default}
.menu-pop kbd{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

.optsbar{grid-area:opts;display:flex;align-items:center;gap:18px;padding:0 16px;height:42px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none;min-width:0}
.optsbar::-webkit-scrollbar{display:none}
.opt-tool{font-weight:700;color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.target-pill{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);background:var(--text);border-radius:4px;padding:3px 6px}
.opt{display:flex;align-items:center;gap:8px;color:var(--muted)}
.opt input[type=range]{width:104px;accent-color:var(--amber)}
.opt output,.readout{font:12px var(--mono);color:var(--text);min-width:46px;font-variant-numeric:tabular-nums}
.opt select,.field select,.field input[type=number],.field input[type=text],.hex{background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 8px;font-size:12px}
.opt input[type=checkbox],.field input[type=checkbox],.fx-head input{accent-color:var(--amber);width:15px;height:15px}
.opt input[type=color],.field input[type=color]{width:40px;height:26px;border:1px solid var(--line);border-radius:6px;background:var(--ink);padding:1px;cursor:pointer}
.hint{color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--chrome-2);color:var(--text);border-radius:6px;padding:5px 10px;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--amber-edge)}
.chip.go{background:var(--amber);color:var(--amber-ink);border-color:transparent}
.chip-group{display:flex;gap:6px;flex-wrap:wrap}

.toolbar{grid-area:tools;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:var(--chrome);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.tool{width:38px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--text);border-radius:8px;cursor:pointer;flex:none}
.tool:hover{background:var(--chrome-2)}
.tool.active{background:var(--amber);color:var(--amber-ink)}
.tool svg{width:20px;height:20px}
.tool-sep{width:24px;height:1px;background:var(--line);margin:4px 0;flex:none}
.mini-colors{position:relative;width:38px;height:38px;flex:none;margin-top:6px}
.msw{position:absolute;width:24px;height:24px;border-radius:5px;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);cursor:pointer;overflow:hidden}
.msw.fg{left:0;top:0;z-index:2}
.msw.bg{right:0;bottom:0}
.msw input,.sw input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;border:0;padding:0}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--pasteboard);min-width:0;min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#textInput{position:absolute;z-index:5;background:rgba(0,0,0,.08);border:1px dashed var(--amber);outline:none;padding:0;margin:0;resize:none;overflow:hidden;white-space:pre;transform-origin:0 0;border-radius:2px;line-height:1.15}
.drop-hint{position:absolute;inset:12px;border:2px dashed var(--amber);border-radius:12px;display:grid;place-items:center;background:rgba(12,13,16,.7);color:var(--amber);font-weight:700;font-size:15px;pointer-events:none;z-index:6}

.panels{grid-area:panels;background:var(--chrome);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.panel{padding:14px 16px;border-bottom:1px solid var(--line)}
.panel.layers{flex:1 0 auto}
.panel.history{border-bottom:0}
.panel h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.sheet-close{display:none}
.colors{display:flex;gap:16px;align-items:center}
.swatch-stack{position:relative;width:66px;height:58px;flex:none}
.sw{position:absolute;width:40px;height:40px;border-radius:7px;border:2px solid var(--chrome);box-shadow:0 0 0 1px var(--line);overflow:hidden;cursor:pointer}
.sw.fg{left:0;top:0;z-index:2}
.sw.bg{right:0;bottom:0}
.color-meta{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.color-meta .row{display:flex;gap:6px;align-items:center}
.hex{font-family:var(--mono);width:100%;min-width:0;text-transform:uppercase}
.palette{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-top:14px}
.palette button{aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.1);cursor:pointer;padding:0;max-width:100%}
.palette button:hover{transform:scale(1.12)}
.layer-props{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.layer-props select{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 6px;font-size:12px}
.layer-props .op{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.layer-props input[type=range]{width:70px;accent-color:var(--amber)}
.layer-props output{font:11px var(--mono);color:var(--text);min-width:34px;text-align:right}
.layer-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.layer{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:7px;cursor:pointer;border:1px solid transparent;min-width:0}
.layer:hover{background:var(--chrome-2)}
.layer.active{background:var(--amber-dim);border-color:var(--amber-edge)}
.thumb-box{width:44px;height:34px;display:grid;place-items:center;flex:none;border-radius:4px;position:relative;border:2px solid transparent}
.thumb-box.target{border-color:var(--text)}
.thumb-box canvas{border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.thumb-box.px canvas{background:var(--checker)}
.thumb-box.adj canvas{background:var(--chrome-2)}
.thumb-box.off::after{content:"";position:absolute;inset:6px;background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--danger) calc(50% - 1.5px),var(--danger) calc(50% + 1.5px),transparent calc(50% + 1.5px))}
.badge{position:absolute;right:-3px;bottom:-3px;font:700 9px var(--ui);background:var(--text);color:var(--ink);border-radius:3px;padding:1px 3px;line-height:1}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lmeta{font:10px var(--mono);color:var(--muted);white-space:nowrap}
.fxb{font:italic 700 12px Georgia,'Times New Roman',serif;color:var(--amber);background:none;border:0;cursor:pointer;padding:0 3px;flex:none}
.eye{width:24px;height:26px;display:grid;place-items:center;border:0;background:none;color:var(--text);border-radius:5px;cursor:pointer;flex:none}
.eye[aria-pressed="false"]{color:var(--muted);opacity:.55}
.rename{flex:1;min-width:0;background:var(--ink);border:1px solid var(--amber);color:var(--text);border-radius:4px;padding:3px 5px;font-size:13px}
.layer-actions{display:flex;gap:0;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);justify-content:space-between}
.layer-actions .icon-btn{width:28px;height:28px;font-size:12px}
.hist-list{list-style:none;margin:0;padding:0;max-height:168px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.hist-item{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:center}
.hist-item:hover{background:var(--chrome-2)}
.hist-item.current{background:var(--amber-dim);color:var(--amber);font-weight:600}
.hist-item.future{color:var(--muted)}
.hist-item .n{font:10px var(--mono);color:var(--muted);min-width:18px;text-align:right}

.status{grid-area:status;display:flex;align-items:center;gap:16px;padding:0 16px;height:30px;background:var(--chrome);border-top:1px solid var(--line);font:11.5px var(--mono);color:var(--muted);white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums}
.status .tip{font-family:var(--ui);font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
#saveState{font-family:var(--ui);font-size:12px}
.zoomctl{display:flex;align-items:center;gap:2px}
.zoomctl button{background:none;border:0;color:var(--text);font:11.5px var(--mono);padding:3px 7px;border-radius:5px;cursor:pointer}
.zoomctl button:hover{background:var(--chrome-2)}
#zoomVal{min-width:46px;text-align:center;color:var(--text)}

.overlay{position:fixed;inset:0;background:rgba(5,6,8,.62);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{width:min(470px,100%);background:var(--chrome);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto}
.dialog h3{margin:0;padding:18px 20px 0;font-size:15px;font-weight:700}
.dlg-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.field{display:grid;grid-template-columns:104px minmax(0,1fr) auto;align-items:center;gap:10px;color:var(--muted)}
.field input[type=range]{width:100%;accent-color:var(--amber)}
.field output{font:12px var(--mono);color:var(--text);min-width:44px;text-align:right}
.field input[type=number],.field input[type=text],.field select{width:100%}
.dlg-note{margin:0;color:var(--muted);line-height:1.5}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:4px 20px 18px}
.btn{padding:8px 15px;border-radius:7px;border:1px solid var(--line);background:var(--chrome-2);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--amber-edge)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.export-img{max-width:100%;max-height:40vh;display:block;margin:0 auto;background:var(--checker);border-radius:4px;box-shadow:0 0 0 1px var(--line)}
.graph{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:0 auto;border-radius:6px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px var(--line)}
.histo{width:100%;height:110px;display:block;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
.fx-sec{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.fx-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--text);cursor:pointer}
.proj-list{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.proj-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px;border-radius:8px;border:1px solid var(--line)}
.proj-row.current{border-color:var(--amber-edge)}
.proj-row img{width:64px;height:44px;object-fit:contain;background:var(--checker);border-radius:4px}
.proj-meta{min-width:0}
.proj-meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-meta small{color:var(--muted);font:11px var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(56px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chrome-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;grid-template-areas:"menu" "opts" "stage" "tools" "status"}
  .menubar{padding:0 8px}
  .brand{margin-right:4px}
  .brand-name{display:none}
  .menu-btn{padding:6px 7px}
  .toolbar{flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px 12px;overflow-x:auto;overflow-y:hidden}
  .tool-sep{width:1px;height:24px;margin:0 4px}
  .mini-colors{margin:0 0 0 6px}
  .panels{position:fixed;left:0;right:0;bottom:0;max-height:66%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:40;transform:translateY(105%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  .panels.open{transform:none}
  .panel-toggle{display:inline-flex}
  .sheet-close{display:inline-grid}
  .status .tip,#docInfo{display:none}
  .status{justify-content:space-between;gap:10px}
  .field{grid-template-columns:84px minmax(0,1fr) auto}
  .proj-row{grid-template-columns:52px minmax(0,1fr) auto}
  .proj-row img{width:52px}
  .proj-row [data-del]{grid-column:2 / 4;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="menubar">
    <div class="brand"><span class="lamp" aria-hidden="true"></span><span class="brand-name">Safelight</span></div>
    <nav id="menus" aria-label="Main menu"></nav>
    <div class="spacer"></div>
    <button class="icon-btn" id="undoBtn" aria-label="Undo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="icon-btn" id="redoBtn" aria-label="Redo" disabled><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="icon-btn panel-toggle" id="panelToggle" aria-expanded="false" aria-controls="panels"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Layers</button>
  </header>

  <div class="optsbar" id="opts" role="toolbar" aria-label="Tool options"></div>
  <nav class="toolbar" id="tools" aria-label="Tools"></nav>

  <main class="stage" id="stage">
    <canvas id="view" aria-label="Canvas"></canvas>
    <textarea id="textInput" autocomplete="off" spellcheck="false" aria-label="Text" rows="1" hidden></textarea>
    <div class="drop-hint" id="dropHint" hidden>Drop to place image as a new layer</div>
  </main>

  <aside class="panels" id="panels" aria-label="Panels">
    <section class="panel">
      <h2>Color <button class="icon-btn sheet-close" id="sheetClose" aria-label="Close panels"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></h2>
      <div class="colors">
        <div class="swatch-stack">
          <label class="sw fg" id="fgSw" title="Foreground color"><input type="color" id="fgPick" aria-label="Foreground color"></label>
          <label class="sw bg" id="bgSw" title="Background color"><input type="color" id="bgPick" aria-label="Background color"></label>
        </div>
        <div class="color-meta">
          <div class="row"><input class="hex" id="fgHex" type="text" maxlength="7" aria-label="Foreground hex"></div>
          <div class="row">
            <button class="chip" id="swapBtn" title="Swap colors (X)">Swap</button>
            <button class="chip" id="resetBtn" title="Default colors (D)">Reset</button>
          </div>
        </div>
      </div>
      <div class="palette" id="palette"></div>
    </section>
    <section class="panel layers">
      <h2>Layers</h2>
      <div class="layer-props">
        <select id="blendSel" aria-label="Blend mode"></select>
        <label class="op"><span>Opacity</span><input type="range" id="layerOpacity" min="0" max="100" value="100"><output id="layerOpacityOut">100%</output></label>
      </div>
      <ul class="layer-list" id="layerList"></ul>
      <div class="layer-actions">
        <button class="icon-btn" data-action="newLayer" aria-label="New layer" title="New layer"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" data-action="adjMenu" data-pop="adj" aria-label="New adjustment layer" title="New adjustment layer"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
        <button class="icon-btn" data-action="maskButton" aria-label="Add layer mask" title="Add layer mask (uses the selection if there is one)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4.5"/></svg></button>
        <button class="icon-btn" data-action="styleDialog" aria-label="Layer style" title="Layer style"><span style="font:italic 700 14px Georgia,serif">fx</span></button>
        <button class="icon-btn" data-action="dupLayer" aria-label="Duplicate layer" title="Duplicate layer"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg></button>
        <button class="icon-btn" data-action="layerUp" aria-label="Bring forward" title="Bring forward"><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
        <button class="icon-btn" data-action="layerDown" aria-label="Send backward" title="Send backward"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
        <button class="icon-btn" data-action="mergeDown" aria-label="Merge down" title="Merge down"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg></button>

async function downloadProject() {

/* ---------- files ---------- */
const fileIn = $('#fileIn'); let fileMode = 'place';
function pickFile(mode) { fileMode = mode; fileIn.accept = mode === 'open' ? 'image/*,.json,application/json' : 'image/*'; fileIn.value = ''; fileIn.click(); }
fileIn.addEventListener('change', () => { if (fileIn.files[0]) loadFile(fileIn.files[0], fileMode); });
function loadFile(file, mode) {
  if (mode === 'open' && (/\.json$/i.test(file.name || '') || file.type === 'application/json')) {
    file.text().then(t => loadProject(JSON.parse(t), true)).then(() => toast('Project opened')).catch(() => toast("That file isn't a Safelight project."));
    return;
  }
  if (!file.type.startsWith('image/')) { toast('That file is not an image.'); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { URL.revokeObjectURL(url); const name = (file.name || 'Image').replace(/\.[^.]+$/, ''); mode === 'open' ? openImage(img, name) : placeImage(img, name); };
  img.onerror = () => { URL.revokeObjectURL(url); toast("That file couldn't be read as an image."); };
  img.src = url;
}
async function openImage(img, name) {
  const s = Math.min(1, 4096 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
  await switchDoc(() => { S.w = w; S.h = h; buffers(); const l = makeLayer(name); cx(l.canvas).drawImage(img, 0, 0, w, h); S.layers = [l]; S.active = 0; S.docName = name; });

}
function placeImage(img, name) {
  const s = Math.min(1, S.w / img.naturalWidth, S.h / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
  push('Place image'); const l = makeLayer(name); cx(l.canvas).drawImage(img, (S.w - w) / 2, (S.h - h) / 2, w, h); insertLayer(l);
}
let dragDepth = 0;

  if (e.target.matches && e.target.matches('input[type=text],input[type=number],textarea')) return;

});

/* ---------- sample ---------- */
function buildSample() {
  const W = 1200, H = 800; S.w = W; S.h = H; buffers();
  const sky = makeLayer('Sky'); let c = cx(sky.canvas);
  let g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1d2b53'); g.addColorStop(.55, '#c8647a'); g.addColorStop(1, '#f4c27a'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 110; i++) { c.globalAlpha = .25 + rnd() * .6; c.fillStyle = '#ffffff'; c.beginPath(); c.arc(rnd() * W, rnd() * H * .42, .4 + rnd() * 1.3, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  const sun = makeLayer('Sun'); c = cx(sun.canvas);
  g = c.createRadialGradient(840, 560, 0, 840, 560, 190); g.addColorStop(0, '#fff4d6'); g.addColorStop(.42, '#ffd08a'); g.addColorStop(.6, 'rgba(255,170,90,.5)'); g.addColorStop(1, 'rgba(255,140,80,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H);

  const hills = makeLayer('Hills'); c = cx(hills.canvas);
  c.fillStyle = '#5b3a5e'; c.beginPath(); c.moveTo(0, 600); c.bezierCurveTo(200, 520, 380, 540, 560, 590); c.bezierCurveTo(740, 640, 900, 560, 1200, 585); c.lineTo(1200, 800); c.lineTo(0, 800); c.fill();
  c.fillStyle = '#2a1d36'; c.beginPath(); c.moveTo(0, 690); c.bezierCurveTo(260, 620, 460, 705, 700, 682); c.bezierCurveTo(900, 664, 1050, 705, 1200, 660); c.lineTo(1200, 800); c.lineTo(0, 800); c.fill();
  const curves = makeLayer('Curves'); curves.adj = { type: 'curves', params: { ...defaultParams('curves'), rgb: [[0, 0], [70, 56], [190, 205], [255, 255]] } }; curves.mask = whiteMask(); curves.opacity = .8;
  const title = makeLayer('GOLDEN HOUR'); title.autoName = true;
  title.text = { str: 'GOLDEN HOUR', font: 'Bebas Neue', size: 160, color: '#fff6e6', align: 'left', m: [1, 0, 0, 1, 76, 86] };
  title.style = { ...deep(STYLE_DEF), shadow: { ...STYLE_DEF.shadow, on: true, color: '#1d1405', opacity: 45, distance: 8, size: 18 } };
  const m = mk(W, H), mc = cx(m); g = mc.createLinearGradient(700, 0, 1150, 0); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#000000'); mc.fillStyle = g; mc.fillRect(0, 0, W, H);

  S.layers = [sky, sun, hills, curves, title, sub]; S.active = 2; S.docName = 'Golden hour (sample)';
}

  ['File', [['New…', 'newDoc'], ['Open…', 'open'], ['Projects…', 'projects'], ['Place image as layer…', 'place'], '-', ['Save', 'save', MOD + 'S'], ['Rename…', 'rename'], ['Download project file…', 'downloadProject'], '-', ['Export image…', 'export', MOD + SHIFT + 'E'], '-', ['Load sample artwork', 'sample']]],

    ['Bring forward', 'layerUp', MOD + ']', () => S.active < S.layers.length - 1], ['Send backward', 'layerDown', MOD + '[', () => S.active > 0], ['Merge down', 'mergeDown', MOD + 'E', () => S.active > 0], ['Flatten image', 'flatten', '', () => S.layers.length > 1]]]

const pop = $('#menuPop'); let openMenu = -1;

function showPopItems(items, rect, menuIdx) {

const A = {

  save: async () => { if (!IDB.ok) { toast('This browser is blocking storage here. Use Download project file instead.'); return; } S.unsaved = true; await saveNow(); toast('Saved in this browser'); },
  rename: renameDialog, downloadProject,
  undo: () => undo(), redo: () => redo(), cut, copy: () => copy(false), paste: pasteInternal, clear: clearSel, fillFg, transform: startTransform,
  selectAll, deselect, selectInverse, feather: featherDialog, selectLayerPixels,

function run(a) {

/* ---------- keyboard ---------- */
const KEYTOOL = { v: 'move', m: 'marquee', l: 'lasso', w: 'wand', c: 'crop', b: 'brush', e: 'eraser', s: 'clone', j: 'heal', i: 'eyedropper', t: 'text', u: 'shape', h: 'hand', z: 'zoom' };
document.addEventListener('keydown', e => {
  const t = e.target;
  if (dlgState) { if (e.key === 'Escape') closeDialog(!!dlgState.noCancel); return; }
  if (t.matches && t.matches('input[type=text],input[type=number],input:not([type]),textarea,select')) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), kc = e.code && e.code.startsWith('Key') ? e.code.slice(3).toLowerCase() : k;
  if (mod) {
    const map = {

      s: () => e.shiftKey ? exportDialog() : A.save(), e: () => e.shiftKey ? exportDialog() : mergeDown(),
      '0': fit, '1': A.actual, '=': A.zoomIn, '+': A.zoomIn, '-': A.zoomOut, j: dupLayer,
      i: () => e.shiftKey ? selectInverse() : quickAdjust('invert'), u: () => openAdjust('hs'), l: () => openAdjust('levels'), m: () => openAdjust('curves'),
      t: startTransform, ']': A.layerUp, '[': A.layerDown

    if (map[kc]) { e.preventDefault(); closeMenus(); if (!['z', 'y', 't'].includes(kc)) { if (xf) commitTransform(); abortOp(); } map[kc](); }
    return;
  }
  if (e.key === ' ') { e.preventDefault(); if (!spaceDown) { spaceDown = true; setCursor(); req(); } return; }
  if (e.key === 'Enter') { if (xf) { e.preventDefault(); commitTransform(); } else if (S.tool === 'crop' && cropR) { e.preventDefault(); commitCrop(); } return; }
  if (e.key === 'Escape') { if (!pop.hidden) closeMenus(); else if (xf) cancelTransform(); else if (op) abortOp(); else if (S.tool === 'crop') A.cropReset(); else deselect(); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); if (e.altKey) fillFg(); else if (S.sel) clearSel(); else toast('Select an area first, or use Edit › Clear to empty the layer.'); return; }
  if (e.key.startsWith('Arrow') && (S.tool === 'move' || xf)) { e.preventDefault(); const d = e.shiftKey ? 10 : 1; nudge(e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0, e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0); return; }

  if (kc === 'g') { setTool(S.tool === 'fill' ? 'gradient' : 'fill'); return; }

  if (k === '[' || k === ']') { const s = S.opt.size, step = s > 100 ? 20 : s > 30 ? 5 : s > 10 ? 2 : 1; setOpt('size', clamp(s + (k === ']' ? step : -step), 1, 400)); return; }
});
document.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; setCursor(); req(); } });
